name: Apply classification batch chunking patch

on:
  push:
    branches:
      - fix/classification-batch-chunking
    paths:
      - .github/workflows/classification-batch-chunking-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("pickem_flask_htmx_tabs.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              'CLASSIFICATION_IMPORT_CHUNK_SIZE = 50\n',
              'CLASSIFICATION_IMPORT_CHUNK_SIZE = 50\n'
              'CLASSIFICATION_SUBMIT_CHUNK_SIZE = 100\n',
              'submission chunk constant',
          )

          marker = '''def _update_classification_job_from_batch(\n    job: CorrespondentClassificationJob,\n    remote_batch: Any,\n) -> None:\n'''
          helper = '''def _batch_level_error_message(remote_batch: Any) -> Optional[str]:\n    errors = _openai_value(remote_batch, "errors")\n    data = _openai_value(errors, "data") if errors is not None else None\n    if not isinstance(data, (list, tuple)) or not data:\n        return None\n    first = data[0]\n    message = _openai_value(first, "message")\n    code = _openai_value(first, "code")\n    if message and code:\n        return f"{code}: {message}"\n    if message or code:\n        return str(message or code)\n    return "OpenAI Batch failed"\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit(f"batch error helper marker: expected 1 match, found {text.count(marker)}")
          text = text.replace(marker, helper + marker, 1)

          replace_once(
              '''    job.last_synced_at = utcnow()\n    if job.status in TERMINAL_CLASSIFICATION_JOB_STATUSES and job.completed_at is None:\n''',
              '''    batch_error_message = _batch_level_error_message(remote_batch)\n    if batch_error_message:\n        job.error_message = batch_error_message[:2000]\n    job.last_synced_at = utcnow()\n    if job.status in TERMINAL_CLASSIFICATION_JOB_STATUSES and job.completed_at is None:\n''',
              'persist batch-level error',
          )

          replace_once(
              '''    candidates, _signal_only = classification_batch_candidates(db, week, pass_number)\n    if not candidates:\n        raise ValueError(\n            f"No pass-{pass_number} sources are eligible for classification; "\n            "they are already completed or assigned to an active batch"\n        )\n    selected_model = classifier_model(model)\n''',
              '''    active_job = db.query(CorrespondentClassificationJob).filter(\n        CorrespondentClassificationJob.week_id == week.id,\n        CorrespondentClassificationJob.prompt_version == CLASSIFIER_PROMPT_VERSION,\n        CorrespondentClassificationJob.pass_number == pass_number,\n        CorrespondentClassificationJob.status.in_(ACTIVE_CLASSIFICATION_JOB_STATUSES),\n    ).order_by(CorrespondentClassificationJob.id.desc()).first()\n    if active_job is not None:\n        raise ValueError(\n            f"Pass {pass_number} already has an active classification Batch"\n        )\n\n    candidates, _signal_only = classification_batch_candidates(db, week, pass_number)\n    if not candidates:\n        raise ValueError(\n            f"No pass-{pass_number} sources are eligible for classification; "\n            "they are already completed or assigned to an active batch"\n        )\n    candidates = candidates[:CLASSIFICATION_SUBMIT_CHUNK_SIZE]\n    selected_model = classifier_model(model)\n''',
              'sequential chunk submission',
          )

          replace_once(
              '''    second_pass_job = None\n    completed_pass_one_jobs = [\n        job for job in jobs\n        if job.prompt_version == CLASSIFIER_PROMPT_VERSION\n        and job.pass_number == 1\n        and job.status == "completed"\n    ]\n    if create_second_pass and completed_pass_one_jobs:\n        pass_two_candidates, _ = classification_batch_candidates(db, week, 2)\n''',
              '''    second_pass_job = None\n    completed_pass_one_jobs = [\n        job for job in jobs\n        if job.prompt_version == CLASSIFIER_PROMPT_VERSION\n        and job.pass_number == 1\n        and job.status == "completed"\n    ]\n    active_pass_one_jobs = [\n        job for job in jobs\n        if job.prompt_version == CLASSIFIER_PROMPT_VERSION\n        and job.pass_number == 1\n        and job.status in ACTIVE_CLASSIFICATION_JOB_STATUSES\n    ]\n    active_pass_two_jobs = [\n        job for job in jobs\n        if job.prompt_version == CLASSIFIER_PROMPT_VERSION\n        and job.pass_number == 2\n        and job.status in ACTIVE_CLASSIFICATION_JOB_STATUSES\n    ]\n    readiness = correspondent_classification_readiness(db, week)\n    if (\n        create_second_pass\n        and completed_pass_one_jobs\n        and not active_pass_one_jobs\n        and not active_pass_two_jobs\n        and not readiness["missing_pass_one_source_ids"]\n    ):\n        pass_two_candidates, _ = classification_batch_candidates(db, week, 2)\n''',
              'pass sequencing guard',
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Syntax check
        run: python -m py_compile pickem_flask_htmx_tabs.py

      - name: Verify patch invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("pickem_flask_htmx_tabs.py").read_text(encoding="utf-8")
          checks = {
              "100-source cap": "CLASSIFICATION_SUBMIT_CHUNK_SIZE = 100" in text,
              "candidate slice": "candidates = candidates[:CLASSIFICATION_SUBMIT_CHUNK_SIZE]" in text,
              "batch error persistence": "job.error_message = batch_error_message[:2000]" in text,
              "pass 1 global completion gate": 'not readiness["missing_pass_one_source_ids"]' in text,
              "pass 2 active guard": "and not active_pass_two_jobs" in text,
              "same-pass active guard": "already has an active classification Batch" in text,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Patch verification failed: " + ", ".join(failed))
          print("Patch invariants verified")
          PY

      - name: Run classification-focused tests
        shell: bash
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt >/dev/null; fi
          pytest -q tests/test_classifier.py

      - name: Commit patched application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pickem_flask_htmx_tabs.py
          git diff --cached --check
          git commit -m "Chunk Correspondent classification batches"
          git push origin HEAD:fix/classification-batch-chunking
